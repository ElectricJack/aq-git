[workspace]
members = ["crates/aq-git-protocol", "crates/aq-git-core", "crates/aq-git-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "net", "time", "signal"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
